name: Production CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML Files
        run: |
          find . -name "*.html"

      - name: Verify CSS Files
        run: |
          find . -name "*.css"

      - name: Build Docker Image
        run: |
          docker build -t production-university-website .